name: cpu checks
on: [push, pull_request]
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip check
      - run: python tools/preflight.py
      - run: python -m compileall -q src tools
      - run: python -m pytest -q -m "not artifact" --basetemp .test-tmp
